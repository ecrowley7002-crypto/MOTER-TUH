    setTimeout(function(){
      questions=shuffle(original);
      current=0; correct=0; answered=0; locked=false; wrongs=[]; lastWrongs=[];
      setLoad(85,"Building first question.");
      setTimeout(function(){
        render();
      },120);
    },120);
  },120);
}
function render(){
  locked=false;
  var q=questions[current];
  var out='<div class="qnum">Question '+(current+1)+' of '+questions.length+' • Original #'+q.num+'</div>';
  out+='<div class="qtext">'+safe(q.q)+'</div>';
  for(var i=0;i<q.choices.length;i++){
    out+='<button class="option" onclick="pick('+i+')"><span class="bubble"></span><span>'+String.fromCharCode(65+i)+'. '+safe(q.choices[i])+'</span></button>';
  }
  out+='<p id="msg" class="msg">Pick one answer. Once you pick, it locks in.</p>';
  byId("card").innerHTML=out;
  nextBtn.disabled=true;
  nextBtn.textContent=(current===questions.length-1)?"Finish":"Next";
  updateBars();
  window.scrollTo(0,0);
}
function pick(i){
  if(locked)return;
  locked=true; answered++;
  var q=questions[current];
  var opts=document.getElementsByClassName("option");
  for(var k=0;k<opts.length;k++)opts[k].disabled=true;
  if(i===q.correct){
    correct++;
    opts[i].className+=" correct";
    byId("msg").innerHTML='<span class="good">Good job.</span> '+safe(q.why);
  }else{
    opts[i].className+=" wrong";
    opts[q.correct].className+=" correct";
    wrongs.push(q);
    lastWrongs.push({q:q,picked:i});
    byId("msg").innerHTML='<span class="bad">Wrong.</span> Correct answer: <b>'+String.fromCharCode(65+q.correct)+'. '+safe(q.choices[q.correct])+'</b><br><br>'+safe(q.why);
  }
  nextBtn.disabled=false;
  updateBars();
}
function next(){
  if(!locked)return;
  current++;
  if(current>=questions.length)finish(); else render();
}
function updateBars(){
  var pct=Math.round((answered/(questions.length||1))*100);
  var score=answered?Math.round((correct/answered)*100):0;
  byId("progressText").textContent=pct+"% complete • "+answered+" answered out of "+questions.length;
  byId("scoreText").textContent="Score: "+score+"% • Correct: "+correct+" • Wrong: "+(answered-correct);
  byId("fill").style.width=pct+"%";
}
function restartAll(){
  questions=shuffle(original); current=0; correct=0; answered=0; locked=false; wrongs=[]; lastWrongs=[]; nextBtn.style.display="inline-block"; render();
}
function restartWrong(){
  if(!lastWrongs.length)return;
  questions=shuffle(lastWrongs.map(function(x){return x.q;})); current=0; correct=0; answered=0; locked=false; wrongs=[]; nextBtn.style.display="inline-block"; render();
}
function finish(){
  var score=answered?Math.round((correct/answered)*100):0;
  byId("progressText").textContent="100% complete";
  byId("scoreText").textContent="Final score: "+score+"%";
  byId("fill").style.width="100%";
  nextBtn.style.display="none";
  var out='<div class="qtext">Results</div><p style="font-size:22px">Final Score: <b>'+score+'%</b></p>';
  out+='<p>Correct: '+correct+'<br>Wrong: '+(answered-correct)+'<br>Total: '+answered+'</p>';
  out+='<button class="secondary" onclick="restartAll()">Restart whole test</button>';
  if(lastWrongs.length)out+='<button class="secondary" onclick="restartWrong()">Study only the ones I got wrong</button>';
  if(lastWrongs.length){out+='<h2>Missed Review</h2>'; for(var i=0;i<lastWrongs.length;i++){var item=lastWrongs[i],q=item.q; out+='<div class="review"><b>Original #'+q.num+'. '+safe(q.q)+'</b><br>You picked: '+String.fromCharCode(65+item.picked)+'. '+safe(q.choices[item.picked])+'<br>Correct: '+String.fromCharCode(65+q.correct)+'. '+safe(q.choices[q.correct])+'<br><span class="small">'+safe(q.why)+'</span></div>';}}
  byId("card").innerHTML=out;
  window.scrollTo(0,0);
}
nextBtn.onclick=next;
setTimeout(boot,100);
</script>
</body>
</html>
